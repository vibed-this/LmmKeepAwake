name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned to windows-2022: the project targets Visual Studio 2022
    # (see CMakePresets.json), while windows-latest now ships VS 2026.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          cmake --version
          ctest --version

      - name: Configure (Debug)
        run: cmake --preset windows-msvc-debug

      - name: Build (Debug)
        run: cmake --build --preset windows-msvc-debug

      - name: Configure (Release)
        run: cmake --preset windows-msvc-release

      - name: Build (Release)
        run: cmake --build --preset windows-msvc-release

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exes = @(
            "build/windows-msvc-debug/Debug/MiuKeepAwake.exe",
            "build/windows-msvc-release/Release/MiuKeepAwake.exe"
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path -LiteralPath $exe)) {
              throw "Missing expected artifact: $exe"
            }
            Get-Item -LiteralPath $exe | Format-Table Name, Length, LastWriteTime
          }
